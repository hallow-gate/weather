services:
  - type: web
    name: myweatherapp  
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    publishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
