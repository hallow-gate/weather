<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c0c0c0" />
    <meta name="description" content="Weather App with Water Tracker" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Weather & Water Tracker</title>
    <style>
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(192, 192, 192, 0.3);
        border-radius: 50%;
        border-top-color: #808080;
        animation: spin 1s ease-in-out infinite;
        margin: 50px auto;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .error-message {
        color: #ff6b6b;
        text-align: center;
        margin: 20px;
      }
      
      .retry-button {
        background: var(--silver-gradient);
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        margin: 20px auto;
        display: block;
      }
      
      .weather-dashboard {
        padding: 20px;
        min-height: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
